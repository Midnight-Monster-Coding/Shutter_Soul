<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Shutter Soul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        /* Loading */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 999;
        }

        .loading-screen.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Profile Container */
        .profile-wrapper {
            margin-top: 70px;
            padding: 20px;
            display: none;
        }

        .profile-wrapper.visible {
            display: block;
        }

        .profile-header {
            text-align: center;
            padding: 30px 0;
        }

        .profile-avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #222;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0 30px;
        }

        .stat-card {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        /* Gallery Section */
        .gallery-header {
            font-size: 16px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #111;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-rating {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            color: #00d4ff;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 16px;
        }

        /* Error Screen */
        .error-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 999;
        }

        .error-screen.visible {
            display: flex;
        }

        .error-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff3366;
        }

        .error-text {
            color: #888;
            margin-bottom: 30px;
        }

        .back-button {
            padding: 12px 30px;
            background: #00d4ff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1 class="header-title">Profile</h1>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading profile...</p>
    </div>

    <!-- Error Screen -->
    <div class="error-screen" id="errorScreen">
        <div class="error-icon">⚠️</div>
        <h2 class="error-title">Error Loading Profile</h2>
        <p class="error-text" id="errorText">Something went wrong</p>
        <button class="back-button" onclick="history.back()">Go Back</button>
    </div>

    <!-- Profile Wrapper -->
    <div class="profile-wrapper" id="profileWrapper">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar-container">
                <img id="avatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e91e63'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <h2 class="profile-name" id="userName">Loading...</h2>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="userRank">#0</div>
                <div class="stat-label">Rank</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="userScore">0</div>
                <div class="stat-label">Total Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="userPhotos">0</div>
                <div class="stat-label">Photos</div>
            </div>
        </div>

        <!-- Medals / Achievements -->
        <div class="gallery-header">Achievements</div>
        <div id="medalsContainer" style="display:flex; flex-wrap:wrap; gap:12px; padding:0 1rem 1rem; justify-content:center;">
            <p style="color:#666; font-size:14px;">Loading achievements...</p>
        </div>

        <!-- Gallery Section -->
        <div class="gallery-header">Gallery</div>
        <div class="photos-grid" id="photosGrid">
            <div class="empty-message">Loading photos...</div>
        </div>
    </div>

    <script type="module">
        import { getDatabase, ref, onDisconnect, set, serverTimestamp as rtdbServerTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, getDocs, collection, query, where, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
        apiKey: "AIzaSyD3rQ3l-AlnJhCOCcA7_h2rQHfdxDz1Of0",
        authDomain: "shutter-soul.firebaseapp.com",
        projectId: "shutter-soul",
        storageBucket: "shutter-soul.appspot.com",
        messagingSenderId: "602126305011",
        appId: "1:602126305011:web:c059836dae27a208e95986",
        measurementId: "G-MSSSHJKN28",
        // ✅ FIX: Added the mandatory Asia database URL so presence works
        databaseURL: "https://shutter-soul-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };

    // ✅ FIX: Ordered correctly. App MUST be initialized before db and rtdb
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

        // ✅ BUG FIX 2 — Timezone-safe date helpers
        function getLocalDate() { return new Date().toLocaleDateString('en-CA'); }
        function getLocalMonthYear() { return getLocalDate().slice(0, 7); }

        // Get userId from URL
        const urlParams = new URLSearchParams(window.location.search);
        const viewingUserId = urlParams.get('userId');

        console.log('🔍 Viewing userId:', viewingUserId);

        // Redirect if no userId
        if (!viewingUserId) {
            console.log('❌ No userId provided');
            window.location.href = 'profile.html';
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                console.log('❌ Not logged in');
                window.location.href = 'login.html';
                return;
            }

            console.log('✅ Logged in as:', user.uid);

            // If viewing own profile, redirect to profile.html
            if (viewingUserId === user.uid) {
                console.log('➡️ Viewing own profile, redirecting...');
                window.location.href = 'profile.html';
                return;
            }

            // Load the user's profile
            await loadProfile(viewingUserId);
        });

        async function loadProfile(userId) {
            try {
                console.log('📥 Loading profile for:', userId);

                // Get user data
                const userDoc = await getDoc(doc(db, 'users', userId));
                
                if (!userDoc.exists()) {
                    console.error('❌ User not found');
                    showError('User not found');
                    return;
                }

                const userData = userDoc.data();
                console.log('✅ User data:', userData);

                // Update UI
                document.getElementById('userName').textContent = userData.displayName || 'Anonymous';
                
                if (userData.photoURL) {
                    document.getElementById('avatarImg').src = userData.photoURL;
                }

                // Load stats (also loads achievements with correct rank)
                await loadStats(userId);

                // Show profile
                hideLoading();
                showProfile();

            } catch (error) {
                console.error('❌ Error:', error);
                showError('Failed to load profile: ' + error.message);
            }
        }

        // Helper: generate YYYY-MM strings newest-first
        function buildMonthsQueue(startMonth = '2025-01') {
            const months = [];
            const [sy, sm] = startMonth.split('-').map(Number);
            const now = new Date();
            const endY = now.getFullYear();
            const endM = now.getMonth() + 1;
            let y = sy, m = sm;
            while (y < endY || (y === endY && m <= endM)) {
                months.push(`${y}-${String(m).padStart(2, '0')}`);
                m++;
                if (m > 12) { m = 1; y++; }
            }
            return months.reverse();
        }

        // Gallery pagination state
        let upGalleryMonthQueue = [];
        let upGalleryMonthIdx   = 0;
        let upGalleryAllLoaded  = false;
        let upGalleryPhotos     = [];
        let upViewingUserId     = null;

        async function loadStats(userId) {
            upViewingUserId = userId;
            try {
                const currentMonthYear = getLocalMonthYear();

                // --- Current month score (for rank display) ---
                let currentMonthScore = 0;
                try {
                    const snap = await getDocs(collection(db, 'dailyUploads', currentMonthYear, userId));
                    snap.forEach(d => {
                        const data = d.data();
                        // ✅ BUG FIX 1: Include Golden Hour multiplier + battleWins
                        const rawLikes   = data.likes || 0;
                        const multiplier = data.goldenHourMultiplier || 1.0;
                        const battleWins = data.battleWins || 0;
                        currentMonthScore += (data.rating || 0) + Math.round(rawLikes * multiplier) + battleWins;
                    });
                } catch (_) {}

                document.getElementById('userScore').textContent = currentMonthScore;

                // --- Gallery: load current month first, paginate on demand ---
                upGalleryMonthQueue = buildMonthsQueue('2025-01');
                upGalleryMonthIdx   = 0;
                upGalleryAllLoaded  = false;
                upGalleryPhotos     = [];

                await loadNextUserGalleryMonth(userId);

                // Rank (current month only) — 🚨 FIX: capture and pass rank to loadAchievements
                const rank = await calculateRank(userId, currentMonthScore, currentMonthYear);

                // Render gallery
                renderUserGallery();

                // Pass the correct rank so achievements match stats card
                await loadAchievements(userId, rank);

            } catch (error) {
                console.error('❌ Stats error:', error);
            }
        }

        async function loadNextUserGalleryMonth(userId) {
            if (upGalleryMonthIdx >= upGalleryMonthQueue.length) {
                upGalleryAllLoaded = true;
                return;
            }
            const monthYear = upGalleryMonthQueue[upGalleryMonthIdx++];
            try {
                const snap = await getDocs(collection(db, 'dailyUploads', monthYear, userId));
                snap.forEach(d => {
                    const data = d.data();
                    upGalleryPhotos.push({
                        id: d.id,
                        imageUrl: data.imageUrl,
                        rating: data.rating || 0,
                        uploadTimestamp: data.uploadTimestamp || 0
                    });
                });
            } catch (_) {}
            if (upGalleryMonthIdx >= upGalleryMonthQueue.length) upGalleryAllLoaded = true;
        }

        function renderUserGallery() {
            const grid = document.getElementById('photosGrid');
            upGalleryPhotos.sort((a, b) => b.uploadTimestamp - a.uploadTimestamp);

            // Update photo count
            document.getElementById('userPhotos').textContent =
                upGalleryPhotos.length + (upGalleryAllLoaded ? '' : '+');

            if (upGalleryPhotos.length === 0) {
                grid.innerHTML = '<div class="empty-message">No photos yet</div>';
                return;
            }

            let html = '';
            upGalleryPhotos.forEach(photo => {
                html += `
                    <div class="photo-item">
                        <img src="${photo.imageUrl}" alt="Photo" loading="lazy">
                        <div class="photo-rating">${photo.rating}/77</div>
                    </div>`;
            });

            if (!upGalleryAllLoaded) {
                html += `
                    <div style="grid-column:1/-1;text-align:center;padding:16px;">
                        <button id="upLoadOlderBtn" onclick="upLoadOlderPhotos()"
                            style="background:#111;color:#00d4ff;border:1px solid #00d4ff;border-radius:8px;
                                   padding:10px 24px;font-size:14px;cursor:pointer;">
                            Load older photos
                        </button>
                    </div>`;
            } else {
                html += `<div style="grid-column:1/-1;text-align:center;padding:12px;color:#444;font-size:13px;">All photos loaded ✓</div>`;
            }

            grid.innerHTML = html;
        }

        window.upLoadOlderPhotos = async function() {
            const btn = document.getElementById('upLoadOlderBtn');
            if (btn) { btn.textContent = 'Loading…'; btn.disabled = true; }
            await loadNextUserGalleryMonth(upViewingUserId);
            renderUserGallery();
        };

        async function loadAchievements(viewedUserId, liveRank) {
            const medalsContainer = document.getElementById('medalsContainer');
            try {
                let medalsHTML = '';

                // 1. Fetch Official Past Medals for this specific user
                const q = query(collection(db, 'users', viewedUserId, 'achievements'), orderBy('awardedAt', 'desc'));
                const snap = await getDocs(q);

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const medalEmoji = data.medal === 'gold' ? '🥇' : data.medal === 'silver' ? '🥈' : '🥉';
                    medalsHTML += `
                        <div class="medal" style="text-align:center; padding:8px 12px; background:rgba(255,255,255,0.05); border-radius:12px;">
                            <div style="font-size:32px;">${medalEmoji}</div>
                            <div style="font-size:11px; color:#aaa; margin-top:4px;">${data.monthYear} (#${data.position})</div>
                        </div>
                    `;
                });

                // 🚨 Use the exact same rank from the stats card
                if (liveRank > 0 && liveRank <= 3) {
                    const currentMedal = liveRank === 1 ? '🥇' : liveRank === 2 ? '🥈' : '🥉';
                    medalsHTML = `
                        <div class="medal" style="text-align:center; padding:8px 12px; background:rgba(12,192,223,0.08); border:1px solid rgba(12,192,223,0.25); border-radius:12px; opacity:0.9; animation: pulse 2s infinite;">
                            <div style="font-size:32px;">${currentMedal}</div>
                            <div style="font-size:11px; color:#0cc0df; margin-top:4px;">Current Rank #${liveRank}</div>
                        </div>
                    ` + medalsHTML;
                }

                medalsContainer.innerHTML = medalsHTML === ''
                    ? '<p style="color: #666; font-size:14px;">No achievements yet</p>'
                    : medalsHTML;

            } catch (e) {
                console.error('Error loading achievements:', e);
                medalsContainer.innerHTML = '<p style="color: #666; font-size:14px;">No achievements yet</p>';
            }
        }

        async function calculateRank(userId, userScore, monthYear) {
            try {
                // ✅ FIX (BUG 1 — Quota Killer): Read the pre-computed rank written by
                // the updateRankingsOnUpload Cloud Function. This is exactly 1 Firestore
                // read instead of 1 + (N users × their photo count) reads.
                const rankDoc = await getDoc(doc(db, `monthlyRankings/${monthYear}/users/${userId}`));

                if (rankDoc.exists()) {
                    const rank = rankDoc.data().position;
                    document.getElementById('userRank').textContent = rank > 0 ? `#${rank}` : 'N/A';
                    return rank;
                }
                // Not ranked yet — clear the display
                document.getElementById('userRank').textContent = 'N/A';
                return 0;
            } catch (error) {
                console.error('❌ Rank error:', error);
                return 0;
            }
        }

        function hideLoading() {
            document.getElementById('loadingScreen').classList.add('hidden');
        }

        function showProfile() {
            document.getElementById('profileWrapper').classList.add('visible');
        }

        function showError(message) {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('errorScreen').classList.add('visible');
            document.getElementById('errorText').textContent = message;
        }
 // GLOBAL PRESENCE & CALL TRACKER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const myRef = ref(rtdb, `presence/${user.uid}`);
                
                // Set online when page loads
                set(myRef, { state: 'online', last_changed: rtdbServerTimestamp(), userId: user.uid });
                onDisconnect(myRef).set({ state: 'offline', last_changed: rtdbServerTimestamp(), userId: user.uid });

                document.addEventListener('visibilitychange', () => {
                    set(myRef, {
                        state: document.hidden ? 'offline' : 'online',
                        last_changed: rtdbServerTimestamp(),
                        userId: user.uid
                    });
                });


                // ✅ FIX: RACE-CONDITION PROOF GLOBAL INCOMING CALL BANNER
                const callsQuery = query(collection(db, 'calls'), where('calleeId', '==', user.uid), where('status', '==', 'ringing'));
                onSnapshot(callsQuery, (snap) => {
                    snap.docChanges().forEach((change) => {
                        const callData = change.doc.data();
                        const bannerId = `globalCallBanner-${callData.callId}`; // Unique ID per call

                        if (change.type === 'added') {
                            // Tolerate client clock drift up to 2 minutes
                            if (Date.now() - (callData.createdAt?.toMillis?.() || Date.now()) > 120000) return;

                            // Fetch user but DON'T block the main thread
                            getDoc(doc(db, 'users', callData.callerId)).then(cdSnap => {
                                
                                // 🚨 CRITICAL: Check the database ONE more time before creating the banner.
                                // If the caller hung up while we were downloading their name, abort!
                                getDoc(doc(db, 'calls', callData.callId)).then(currentCall => {
                                    if (currentCall.exists() && currentCall.data().status === 'ringing') {
                                        let callerName = 'Someone';
                                        const cd = cdSnap.exists() ? cdSnap.data() : {};
                                        callerName = cd.displayName || cd.customName || cd.name || cd.email?.split('@')[0] || 'Someone';

                                        if (!document.getElementById(bannerId)) {
                                            const banner = document.createElement('div');
                                            banner.id = bannerId;
                                            banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, #667eea, #764ba2);color:white;padding:15px 30px;border-radius:50px;box-shadow:0 10px 30px rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all 0.3s;animation:slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);';
                                            banner.innerHTML = `
                                                <span style="font-size:24px; animation: ring 1s infinite ease-in-out;">📞</span> 
                                                <div>
                                                    <div style="font-weight:bold; font-family: 'Segoe UI', Tahoma, sans-serif;">${callerName} is calling...</div>
                                                    <div style="font-size:12px; opacity:0.9;">Click to answer</div>
                                                </div>`;
                                            banner.onclick = () => window.location.href = `message.html?callId=${callData.callId}&action=accept`;
                                            
                                            if (!document.getElementById('bannerStyles')) {
                                                const style = document.createElement('style');
                                                style.id = 'bannerStyles';
                                                style.textContent = `
                                                    @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }
                                                    @keyframes ring { 0% { transform: rotate(0); } 10% { transform: rotate(15deg); } 20% { transform: rotate(-15deg); } 30% { transform: rotate(10deg); } 40% { transform: rotate(-10deg); } 50% { transform: rotate(0); } 100% { transform: rotate(0); } }
                                                `;
                                                document.head.appendChild(style);
                                            }
                                            document.body.appendChild(banner);
                                            
                                            // Auto-cleanup DOM if it somehow gets stuck
                                            setTimeout(() => { if(banner) banner.remove(); }, 65000); 
                                        }
                                    }
                                });
                            });
                        } else if (change.type === 'modified' || change.type === 'removed') {
                            // Remove the specific banner associated with this callId
                            if (callData.status !== 'ringing' || change.type === 'removed') {
                                const banner = document.getElementById(bannerId);
                                if (banner) banner.remove();
                            }
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
